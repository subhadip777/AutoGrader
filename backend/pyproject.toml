[project]
name = "autograder-backend"
version = "1.0.0"
description = "AutoGrader backend: FastAPI server, LangGraph test generation and grading graphs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "python-dotenv>=1.0.1",
    "langgraph>=1.0.0",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "lizard>=1.17",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
]

[tool.uv.build-backend]
module-name = "simple_agent"
source-include = ["langgraph.json", ".env.example", "Makefile", "tests/**"]
